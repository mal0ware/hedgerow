name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # pyproject.toml pins PyTorch to the CPU wheel index, so this stays small.
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run mypy src
      - run: uv run pytest
      - name: Smoke run of reproduce
        run: uv run python scripts/reproduce.py --fast
