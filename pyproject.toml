[project]
name = "hedgerow"
version = "0.1.0"
description = "Discrete delta hedging, Leland's cost-adjusted hedge and a deep hedge compared on the same simulated paths."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.5",
    "scipy==1.18.1",
    "matplotlib==3.11.2",
    "torch==2.15.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
    "mypy==2.4.1",
    "scipy-stubs==1.18.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hedgerow"]

# The CPU build of PyTorch is about a tenth the size of the CUDA build and is
# all that the tests, CI and the committed results need. See the README for
# how to swap in a CUDA build.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "RUF"]
ignore = ["RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["matplotlib.*"]
ignore_missing_imports = true
